<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="700" fill="#fafafa" rx="12"/>

  <!-- Box 1: Pixel Coordinates -->
  <rect x="250" y="30" width="300" height="80" rx="10" fill="#c8e6c9" stroke="#2e7d32" stroke-width="3"/>
  <text x="400" y="65" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b5e20">📷 Pixel Coordinates</text>
  <text x="400" y="90" text-anchor="middle" font-size="14" fill="#1b5e20">on Camera Feed</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="110" x2="400" y2="140" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 2: Lens Distortion Correction -->
  <rect x="250" y="150" width="300" height="80" rx="10" fill="#bbdefb" stroke="#1565c0" stroke-width="3"/>
  <text x="400" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="#0d47a1">🔧 Lens Distortion</text>
  <text x="400" y="210" text-anchor="middle" font-size="14" fill="#0d47a1">Correction</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="230" x2="400" y2="260" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 3: Homography Matrix -->
  <rect x="250" y="270" width="300" height="80" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="3"/>
  <text x="400" y="305" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">🎯 Homography Matrix</text>
  <text x="400" y="330" text-anchor="middle" font-size="14" fill="#e65100">Transform</text>

  <!-- Arrow 3 -->
  <line x1="400" y1="350" x2="400" y2="380" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 4: 3D Coordinates -->
  <rect x="250" y="390" width="300" height="80" rx="10" fill="#e1bee7" stroke="#7b1fa2" stroke-width="3"/>
  <text x="400" y="425" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a148c">📐 3D Coordinates</text>
  <text x="400" y="450" text-anchor="middle" font-size="14" fill="#4a148c">in Robot World</text>

  <!-- Arrow 4 -->
  <line x1="400" y1="470" x2="400" y2="500" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 5: Inverse Kinematics -->
  <rect x="250" y="510" width="300" height="80" rx="10" fill="#ffe0b2" stroke="#e65100" stroke-width="3"/>
  <text x="400" y="545" text-anchor="middle" font-size="18" font-weight="bold" fill="#bf360c">⚙️ Inverse Kinematics</text>
  <text x="400" y="570" text-anchor="middle" font-size="14" fill="#bf360c">Joint Angles</text>

  <!-- Arrow 5 -->
  <line x1="400" y1="590" x2="400" y2="620" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 6: Robot Motors -->
  <rect x="250" y="630" width="300" height="50" rx="10" fill="#ffcdd2" stroke="#c62828" stroke-width="3"/>
  <text x="400" y="662" text-anchor="middle" font-size="18" font-weight="bold" fill="#b71c1c">🤖 Robot Motors</text>
</svg>
