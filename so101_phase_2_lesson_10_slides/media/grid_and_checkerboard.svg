<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <rect width="800" height="350" fill="#fafafa" rx="12"/>

  <!-- Grid example -->
  <rect x="50" y="30" width="320" height="290" rx="10" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <text x="210" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Grid</text>

  <g>
    <!-- Horizontal lines -->
    <line x1="80" y1="90" x2="340" y2="90" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="130" x2="340" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="170" x2="340" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="210" x2="340" y2="210" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="250" x2="340" y2="250" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="290" x2="340" y2="290" stroke="#333" stroke-width="2"/>
    <!-- Vertical lines -->
    <line x1="100" y1="70" x2="100" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="70" x2="150" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="70" x2="200" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="70" x2="250" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="300" y1="70" x2="300" y2="310" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Checkerboard example -->
  <rect x="430" y="30" width="320" height="290" rx="10" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <text x="590" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Checkerboard</text>

  <g>
    <!-- 6x5 checkerboard -->
    <!-- Row 1 -->
    <rect x="460" y="75" width="40" height="40" fill="#333"/>
    <rect x="500" y="75" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="540" y="75" width="40" height="40" fill="#333"/>
    <rect x="580" y="75" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="620" y="75" width="40" height="40" fill="#333"/>
    <rect x="660" y="75" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <!-- Row 2 -->
    <rect x="460" y="115" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="500" y="115" width="40" height="40" fill="#333"/>
    <rect x="540" y="115" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="580" y="115" width="40" height="40" fill="#333"/>
    <rect x="620" y="115" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="660" y="115" width="40" height="40" fill="#333"/>
    <!-- Row 3 -->
    <rect x="460" y="155" width="40" height="40" fill="#333"/>
    <rect x="500" y="155" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="540" y="155" width="40" height="40" fill="#333"/>
    <rect x="580" y="155" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="620" y="155" width="40" height="40" fill="#333"/>
    <rect x="660" y="155" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <!-- Row 4 -->
    <rect x="460" y="195" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="500" y="195" width="40" height="40" fill="#333"/>
    <rect x="540" y="195" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="580" y="195" width="40" height="40" fill="#333"/>
    <rect x="620" y="195" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="660" y="195" width="40" height="40" fill="#333"/>
    <!-- Row 5 -->
    <rect x="460" y="235" width="40" height="40" fill="#333"/>
    <rect x="500" y="235" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="540" y="235" width="40" height="40" fill="#333"/>
    <rect x="580" y="235" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="620" y="235" width="40" height="40" fill="#333"/>
    <rect x="660" y="235" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <!-- Row 6 -->
    <rect x="460" y="275" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="500" y="275" width="40" height="40" fill="#333"/>
    <rect x="540" y="275" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="580" y="275" width="40" height="40" fill="#333"/>
    <rect x="620" y="275" width="40" height="40" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="660" y="275" width="40" height="40" fill="#333"/>
  </g>
</svg>
