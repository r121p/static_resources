<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinker on Toilet STL Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #f8f9fa;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="canvas"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const container = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8f9fa);

    // Add soft lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const loader = new STLLoader();
    loader.load('assets/Thinker_toilet.stl', (geometry) => {
      geometry.computeVertexNormals();
      const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        metalness: 0.05,
        roughness: 0.35
      });
      const mesh = new THREE.Mesh(geometry, material);

      // Center the model and stand it upright
      geometry.center();
      mesh.rotation.x = -Math.PI / 2;

      // Scale to fit reasonably in view
      const bbox = new THREE.Box3().setFromObject(mesh);
      const size = new THREE.Vector3();
      bbox.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 4 / maxDim;
      mesh.scale.set(scale, scale, scale);

      // Create a pivot group for vertical-axis rotation
      const pivot = new THREE.Group();
      pivot.add(mesh);
      scene.add(pivot);

      // Position camera to frame the model
      const center = new THREE.Vector3();
      bbox.getCenter(center);
      camera.position.set(0, 0, maxDim * scale * 2.5);
      camera.lookAt(0, 0, 0);

      // Animation loop: rotate around vertical (Y) axis
      function animate() {
        requestAnimationFrame(animate);
        pivot.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();
    }, undefined, (error) => {
      console.error('Error loading STL:', error);
      container.innerHTML = '<p style="color:red; text-align:center; padding-top:40%;">Unable to load STL model.</p>';
    });

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
