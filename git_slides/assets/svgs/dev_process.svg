<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="#f5f7fa" rx="12" />

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#263238">
    Building a Web App
  </text>

  <!-- Timeline line -->
  <line x1="90" y1="130" x2="810" y2="130" stroke="#90a4ae" stroke-width="4" stroke-linecap="round" />

  <!-- Node 1: Start -->
  <circle cx="90" cy="130" r="22" fill="#66bb6a" filter="url(#shadow)" />
  <text x="90" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#263238">Start</text>
  <text x="90" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Empty repo</text>

  <!-- Arrow 1 -->
  <line x1="112" y1="130" x2="158" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 2: Feature 1 -->
  <circle cx="180" cy="130" r="22" fill="#42a5f5" filter="url(#shadow)" />
  <text x="180" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">F1</text>
  <text x="180" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Login page</text>

  <!-- Arrow 2 -->
  <line x1="202" y1="130" x2="248" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 3: Feature 2 -->
  <circle cx="270" cy="130" r="22" fill="#42a5f5" filter="url(#shadow)" />
  <text x="270" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">F2</text>
  <text x="270" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Payment</text>

  <!-- Arrow 3 -->
  <line x1="292" y1="130" x2="338" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 4: Feature 3 -->
  <circle cx="360" cy="130" r="22" fill="#42a5f5" filter="url(#shadow)" />
  <text x="360" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">F3</text>
  <text x="360" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Email alerts</text>

  <!-- Arrow 4 -->
  <line x1="382" y1="130" x2="428" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 5: Messed up -->
  <circle cx="450" cy="130" r="26" fill="#ef5350" filter="url(#shadow)" />
  <text x="450" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">💥</text>
  <text x="450" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c62828">Messed up!</text>

  <!-- Arrow 5 (dashed, going back) -->
  <path d="M 450 104 Q 450 65 540 65 Q 630 65 630 104" fill="none" stroke="#ef5350" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrowhead)" />
  <text x="540" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#c62828">Lose everything</text>

  <!-- Node 6: Start again -->
  <circle cx="630" cy="130" r="22" fill="#78909c" filter="url(#shadow)" />
  <text x="630" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#263238">Again</text>
  <text x="630" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Start over</text>

  <!-- Arrow 6 -->
  <line x1="652" y1="130" x2="698" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 7: Feature 1 again -->
  <circle cx="720" cy="130" r="22" fill="#42a5f5" opacity="0.5" filter="url(#shadow)" />
  <text x="720" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">F1</text>
  <text x="720" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Rebuild login</text>

  <!-- Question box -->
  <rect x="250" y="270" width="400" height="36" rx="18" fill="#263238" />
  <text x="450" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">How do we prevent losing all this progress?</text>
</svg>
