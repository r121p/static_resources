<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" fill="#f5f7fa" rx="12" />

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#263238">
    Step 3: Continue from the Safe Commit
  </text>

  <!-- Timeline line -->
  <line x1="90" y1="130" x2="910" y2="130" stroke="#90a4ae" stroke-width="4" stroke-linecap="round" />

  <!-- Node 1: Start -->
  <circle cx="90" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="90" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C1</text>
  <text x="90" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Start</text>
  <text x="90" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 1 -->
  <line x1="108" y1="130" x2="162" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 2: Login -->
  <circle cx="180" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="180" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C2</text>
  <text x="180" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Login</text>
  <text x="180" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 2 -->
  <line x1="198" y1="130" x2="252" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 3: Payment -->
  <circle cx="270" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="270" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C3</text>
  <text x="270" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Payment</text>
  <text x="270" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 3 -->
  <line x1="288" y1="130" x2="342" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 4: Email -->
  <circle cx="360" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="360" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C4</text>
  <text x="360" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Email</text>
  <text x="360" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 4 -->
  <line x1="378" y1="130" x2="462" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 5: Search -->
  <circle cx="480" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="480" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C5</text>
  <text x="480" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Search</text>
  <text x="480" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 5 -->
  <line x1="498" y1="130" x2="582" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 6: Deploy -->
  <circle cx="600" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="600" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C6</text>
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Deploy</text>
  <text x="600" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 6 -->
  <line x1="618" y1="130" x2="702" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 7: Analytics -->
  <circle cx="720" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="720" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C7</text>
  <text x="720" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Analytics</text>
  <text x="720" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 7 -->
  <line x1="738" y1="130" x2="822" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 8: Release -->
  <circle cx="840" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="840" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C8</text>
  <text x="840" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Release</text>
  <text x="840" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Caption -->
  <rect x="300" y="270" width="400" height="36" rx="18" fill="#263238" />
  <text x="500" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Development continues from the safe snapshot</text>
</svg>
