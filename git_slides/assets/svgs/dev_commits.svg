<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="#f5f7fa" rx="12" />

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#263238">
    Git: Checkpoints for Code
  </text>

  <!-- Timeline line -->
  <line x1="90" y1="130" x2="810" y2="130" stroke="#90a4ae" stroke-width="4" stroke-linecap="round" />

  <!-- Node 1: Start -->
  <circle cx="90" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="90" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C1</text>
  <text x="90" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Start</text>
  <text x="90" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">init repo</text>

  <!-- Arrow 1 -->
  <line x1="108" y1="130" x2="162" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 2: Feature 1 -->
  <circle cx="180" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="180" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C2</text>
  <text x="180" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Login</text>
  <text x="180" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 2 -->
  <line x1="198" y1="130" x2="252" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 3: Feature 2 -->
  <circle cx="270" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="270" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C3</text>
  <text x="270" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Payment</text>
  <text x="270" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 3 -->
  <line x1="288" y1="130" x2="342" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 4: Feature 3 -->
  <circle cx="360" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="360" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C4</text>
  <text x="360" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Email</text>
  <text x="360" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 4 -->
  <line x1="378" y1="130" x2="432" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 5: Messed up -->
  <circle cx="450" cy="130" r="24" fill="#ef5350" filter="url(#shadow)" />
  <text x="450" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">💥</text>
  <text x="450" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c62828">Messed up!</text>

  <!-- Arrow 5: checkout previous commit -->
  <path d="M 450 106 Q 450 65 405 65 Q 360 65 360 106" fill="none" stroke="#ff7043" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrowhead)" />
  <text x="405" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ff7043">Checkout C4</text>

  <!-- Arrow 6: continue from C4 -->
  <line x1="378" y1="130" x2="558" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 6: Fix -->
  <circle cx="576" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="576" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C5</text>
  <text x="576" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Fix</text>
  <text x="576" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 7 -->
  <line x1="594" y1="130" x2="648" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 7: Deploy -->
  <circle cx="666" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="666" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C6</text>
  <text x="666" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">Deploy</text>
  <text x="666" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Arrow 8 -->
  <line x1="684" y1="130" x2="738" y2="130" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 8: More features -->
  <circle cx="756" cy="130" r="18" fill="#ff7043" filter="url(#shadow)" />
  <text x="756" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C7</text>
  <text x="756" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#37474f">More</text>
  <text x="756" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#546e7a">commit</text>

  <!-- Caption -->
  <rect x="250" y="270" width="400" height="36" rx="18" fill="#263238" />
  <text x="450" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Each Git commit is a snapshot you can return to</text>
</svg>
